name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  # Mirrors src/latexSupport.ts: LaTeX stays off until the in-house engine
  # replaces the unmaintained SwiftLaTeX endpoint. Flip both to true at the
  # same time. When true, the desktop bundles below also register meditor
  # for .tex/.latex/.ltx via conf/latex-enabled.json.
  LATEX_ENABLED: "false"

  # The in-app updater ships switched off, because turning it on needs a
  # signing key that only the release owner can hold. With
  # createUpdaterArtifacts set and no TAURI_SIGNING_PRIVATE_KEY the build
  # fails, so flipping this without the two secrets below breaks the release.
  #
  # To turn it on: run `pnpm tauri signer generate`, paste the public key into
  # conf/updater-enabled.json, put the private key and its password in the
  # repository secrets TAURI_SIGNING_PRIVATE_KEY and
  # TAURI_SIGNING_PRIVATE_KEY_PASSWORD, and set this to "true". Until then the
  # menu entry is there and reports that it could not check, which is honest.
  UPDATER_ENABLED: "false"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          # Same mirror stall as ci.yml, and it matters more here: a release
          # that dies on apt leaves the tag without its Linux bundles.
          # The mirror lives behind `mirror+file:/etc/apt/apt-mirrors.txt`,
          # not in the sources themselves — see ci.yml for the whole story.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            echo "http://archive.ubuntu.com/ubuntu/" | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          fi
          for f in /etc/apt/sources.list /etc/apt/sources.list.d/*.sources /etc/apt/sources.list.d/*.list; do
            [ -f "$f" ] || continue
            sudo sed -i 's|https\?://azure\.archive\.ubuntu\.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' "$f"
          done
          APT_OPTS="-o Acquire::Retries=3 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15"
          updated=false
          for attempt in 1 2 3; do
            if sudo apt-get $APT_OPTS update; then
              updated=true
              break
            fi
            echo "::warning::apt-get update failed (attempt $attempt of 3); retrying"
            sleep 5
          done
          if [ "$updated" != true ]; then
            echo "::error::apt-get update failed three times; the Ubuntu mirrors are unreachable"
            exit 1
          fi
          sudo apt-get $APT_OPTS install -y \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            libglib2.0-dev

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Build and attach to GitHub Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Empty unless the secrets exist, which is exactly when
          # UPDATER_ENABLED is false and no updater artifact is produced.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "meditor ${{ github.ref_name }}"
          # Whoever downloads from this page on Windows 11 meets Smart App
          # Control, so the explanation belongs here rather than only in the
          # docs they have not opened yet.
          releaseBody: |
            ### Windows: Smart App Control will block this installer

            The installers are not code signed, and Windows 11 refuses to run an
            unsigned executable that came from the internet. Nothing is wrong
            with the download.

            **Do not switch Smart App Control off to get around it** — on
            Windows 11 that cannot be undone without reinstalling. Build the
            installer yourself instead (`pnpm tauri build --bundles nsis`); one
            you built carries no mark of the web and installs normally.

            [docs/windows.md](https://github.com/enacimie/meditor/blob/main/docs/windows.md)
            explains the whole thing, including what signing would take.

            ### Android

            `meditor_<version>_arm64-debug.apk` is a debug build signed with
            Android's throwaway key — enough to sideload, nowhere near enough to
            publish.
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          # tauri-action drives the CLI directly, bypassing scripts/tauri.mjs,
          # so the LaTeX overlay is layered here instead of in the npm script.
          args: ${{ matrix.args }} ${{ env.LATEX_ENABLED == 'true' && '--config src-tauri/conf/latex-enabled.json' || '' }} ${{ env.UPDATER_ENABLED == 'true' && '--config src-tauri/conf/updater-enabled.json' || '' }}

  android:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Point Tauri at the runner's NDK
        run: echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: android
      - run: pnpm install --frozen-lockfile
      # Same shim as ci.yml: Gradle's rust plugin shells back out to
      # `cargo tauri android android-studio-script`, so a cargo-tauri must be
      # on PATH. Forwarding to `pnpm` reuses the already-installed npm CLI.
      - name: Let Gradle find a Tauri CLI
        run: |
          mkdir -p "$HOME/.local/bin"
          printf '#!/usr/bin/env bash\nexec pnpm "$@"\n' > "$HOME/.local/bin/cargo-tauri"
          chmod +x "$HOME/.local/bin/cargo-tauri"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: pnpm tauri android build --ci --debug --apk --target aarch64
      - name: Attach the APK to the release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          apk="$(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' | head -1)"
          if [ -z "$apk" ]; then
            echo "the Android build produced no APK" >&2
            exit 1
          fi
          # Gradle names it app-universal-debug.apk, which says nothing about
          # which app or which version once it is sitting on a releases page
          # next to the AppImage and the .deb. The name it goes out under says
          # both — and keeps "debug" visible, because that is what it is: built
          # with Android's throwaway debug key, since signing for release needs
          # a keystore this project does not have.
          version="${{ github.ref_name }}"
          asset="meditor_${version#v}_arm64-debug.apk"
          cp "$apk" "$asset"
          gh release upload "${{ github.ref_name }}" "$asset" \
            --repo "${{ github.repository }}" --clobber
