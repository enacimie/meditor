name: CI

on:
  push:
    # `unstable` is where work is integrated before it reaches main, and
    # commits land on it directly as well as through pull requests. Without it
    # here, anything rebased straight onto the branch — as #30 and #31 were —
    # is merged having never run a single check.
    branches: [main, unstable]
  # No branch filter: a pull request targeting any branch (for example a stacked
  # PR based on another PR's branch) must still be validated. With
  # `branches: [main]` those PRs silently ran no checks at all.
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Full frontend gate: lint, types, audit, coverage, E2E and the production
  # build. Linux only — these steps are platform-independent and running them
  # once keeps the pipeline fast.
  test-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm audit --audit-level=high
      - run: pnpm test:coverage
      - run: pnpm test:e2e
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: coverage/
          if-no-files-found: ignore

  # meditor ships for Windows and macOS too, so the parts that can behave
  # differently per platform (path handling, the E2E runner, the production
  # build) are exercised there as well. The expensive, platform-independent
  # steps stay in the job above.
  test-frontend-os:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test:run
      - run: pnpm test:e2e
      - run: pnpm build

  test-backend:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install system dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 20
        run: |
          # The runner's default mirror, azure.archive.ubuntu.com, goes quiet
          # often enough to be a pattern rather than bad luck, and it takes the
          # whole run with it: every line comes back Ign:, and then apt sits
          # there until this step is killed at twenty minutes.
          #
          # Timeouts alone do not save it — measured, not assumed: with
          # Acquire::http::Timeout=15 in place the InRelease files were fetched
          # and the Packages indices then hung for nineteen silent minutes
          # anyway. What the same log does show is archive.ubuntu.com answering
          # normally in the very same second, so the answer is to stop asking
          # Azure at all.
          #
          # The runner does not name a mirror in its sources: they say
          # `mirror+file:/etc/apt/apt-mirrors.txt`, and that file lists Azure
          # first with archive.ubuntu.com behind it. That indirection is why
          # rewriting sources.list alone changed nothing — the second attempt
          # at this did exactly that and Azure kept showing up. Both are
          # handled now; security.ubuntu.com is a different host, left alone.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            echo "http://archive.ubuntu.com/ubuntu/" | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          fi
          for f in /etc/apt/sources.list /etc/apt/sources.list.d/*.sources /etc/apt/sources.list.d/*.list; do
            [ -f "$f" ] || continue
            sudo sed -i 's|https\?://azure\.archive\.ubuntu\.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' "$f"
          done
          # Printed so that if this ever stalls again the log says which
          # mirrors apt was actually given, instead of leaving it to guesswork.
          echo "--- apt mirrors in effect ---"
          cat /etc/apt/apt-mirrors.txt 2>/dev/null || echo "(no apt-mirrors.txt)"
          grep -rhE "^(deb |URIs:)" /etc/apt/sources.list /etc/apt/sources.list.d/ 2>/dev/null | sort -u
          echo "-----------------------------"
          # Bounded transfer timeouts and retries on top, for the ordinary
          # transient failure that is not this one.
          APT_OPTS="-o Acquire::Retries=3 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15"
          updated=false
          for attempt in 1 2 3; do
            if sudo apt-get $APT_OPTS update; then
              updated=true
              break
            fi
            echo "::warning::apt-get update failed (attempt $attempt of 3); retrying"
            sleep 5
          done
          if [ "$updated" != true ]; then
            echo "::error::apt-get update failed three times; the Ubuntu mirrors are unreachable"
            exit 1
          fi
          sudo apt-get $APT_OPTS install -y \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            libglib2.0-dev
      # Formatting is platform-independent; checking it once is enough.
      - if: runner.os == 'Linux'
        working-directory: src-tauri
        run: cargo fmt --check
      - working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings
      - working-directory: src-tauri
        run: cargo test --lib
      - working-directory: src-tauri
        run: cargo check
      # Nothing else here starts the application. clippy, cargo test and the
      # E2E suite all pass on a binary that dies on launch: the E2E specs drive
      # a browser against the dev server, never the Tauri process. v0.1.9 and
      # v0.2.0 both shipped unable to start — the updater plugin refuses to
      # initialise without `plugins.updater`, which is exactly how it ships —
      # and every check was green.
      #
      # Linux only, and deliberately: a display is cheap to fake here, and the
      # code that broke is behind `#[cfg(desktop)]`, shared by all three. It
      # would not catch something that only fails on Windows or macOS; it does
      # catch anything that stops the app coming up at all.
      - name: The application must start
        if: runner.os == 'Linux'
        working-directory: src-tauri
        run: |
          sudo apt-get install -y --no-install-recommends xvfb
          cargo build --bin meditor
          set +e
          xvfb-run -a timeout 20 target/debug/meditor > start.log 2>&1
          status=$?
          set -e
          cat start.log
          # 124 is timeout killing a window that was still up, which is the
          # healthy outcome. A panic exits 101 and prints; either is a failure.
          if [ "$status" = "101" ] || grep -q "panicked at" start.log; then
            echo "::error::the application does not start (exit $status)"
            exit 1
          fi

  # Android compiles from the same sources, and the ways it can break are ones
  # no desktop job would notice: a plugin that is an empty crate there, an
  # import left over once its only user is gated out. Building it here keeps
  # that from rotting between phone tests, and the APK it uploads lets someone
  # try a change without an SDK, an NDK and a WSL toolchain.
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # The runner image already carries the SDK and an NDK; Tauri looks for
      # the NDK under NDK_HOME, which the image does not set.
      - name: Point Tauri at the runner's NDK
        run: echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: android
      - run: pnpm install --frozen-lockfile
      # Gradle's rust plugin does not build the library itself: it shells back
      # out to `cargo tauri android android-studio-script`, with the executable
      # name hardcoded in the generated buildSrc. So a `cargo-tauri` has to be
      # on PATH even when the outer build is driven by the npm CLI — which is
      # the only one installed here. `cargo install tauri-cli` would compile a
      # large crate on every run for the sake of a binary we already have under
      # another name, so this forwards the identical arguments instead.
      - name: Let Gradle find a Tauri CLI
        run: |
          mkdir -p "$HOME/.local/bin"
          printf '#!/usr/bin/env bash\nexec pnpm "$@"\n' > "$HOME/.local/bin/cargo-tauri"
          chmod +x "$HOME/.local/bin/cargo-tauri"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      # arm64 only: it covers every phone made this decade, and building the
      # other three would triple the slowest job in the pipeline.
      - run: pnpm tauri android build --ci --debug --apk --target aarch64
      - uses: actions/upload-artifact@v4
        with:
          name: meditor-android-debug-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
