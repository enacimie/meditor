<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="theme-color" content="#0969da" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/x-icon" href="./favicon.ico" />
    <title>meditor</title>
    <!-- Anti-FOUC: apply saved theme + language before first paint to
         prevent a flash of the wrong theme, lang attribute, or text direction. -->
    <script>
      (function () {
        try {
          var prefs = null;
          var rawPrefs = localStorage.getItem("meditor.preferences.v1");
          if (rawPrefs) prefs = JSON.parse(rawPrefs);
          if (prefs && prefs.theme) {
            var theme = prefs.theme;
            document.documentElement.dataset.theme = theme;
            if (theme === "contrast") {
              document.documentElement.style.colorScheme = "light";
            } else if (theme === "system") {
              document.documentElement.style.colorScheme = "light dark";
            } else {
              document.documentElement.style.colorScheme = theme;
            }
          }
          // Mirror the language resolution of src/i18n/languageStorage.ts: the
          // stored code wins, otherwise the browser's primary subtag. Codes are
          // 2 or 3 letters (fil, ceb, zgh, kab, shi, rif).
          // KEEP IN SYNC with LANGUAGES/isRtl in src/i18n/translations/index.ts —
          // src/i18n/indexHtml.test.ts fails when these lists drift apart.
          var ALL_LANGS = "en zh hi es ar fr bn pt ru ur id de ja sw mr te tr ta ko it pl vi th fa nl uk ro he ms fil pa jv ha kn gu am yo or ml my uz ig ne si km kk az ku ht ceb sv da fi no cs sk hu bg el ca sr hr lt lv et sl mk sq hy ka mn lo gl eu is mt cy gd ga lb af zu xh st ny mg so ps tk ky tg tt be bs fo ee lg om sd su zgh kab shi rif";
          var RTL_LANGS = "ar ur fa he ps sd";
          function known(list, code) {
            return (" " + list + " ").indexOf(" " + code + " ") !== -1;
          }
          var lang = null;
          var rawLang = localStorage.getItem("meditor.language.v1");
          if (rawLang && known(ALL_LANGS, rawLang)) lang = rawLang;
          if (!lang && navigator && navigator.language) {
            var nav = navigator.language.toLowerCase().split("-")[0];
            if (known(ALL_LANGS, nav)) lang = nav;
          }
          if (lang) {
            document.documentElement.lang = lang;
            if (known(RTL_LANGS, lang)) {
              document.documentElement.dir = "rtl";
            }
          }
        } catch (_) { /* localStorage may be unavailable */ }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
