[package]
name = "meditor"
version = "0.3.1"
description = "Markdown/Typst/LaTeX editor for desktop and mobile with live preview and PDF export"
authors = ["meditor contributors"]
license = "AGPL-3.0-or-later"
edition = "2021"
default-run = "meditor"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "meditor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
# Already in the tree — tauri-plugin-dialog depends on it and re-exports its
# FilePath. Declaring it directly buys the Rust API (Fs::open), which is the
# only thing that can read or write an Android content:// URI. Nothing new
# ends up in the binary, and no new command is exposed to the frontend: the
# plugin's own permissions are not in capabilities/default.json.
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

# "One running copy of the app" is a desktop idea, and the crate agrees: its
# whole source sits behind `#![cfg(not(any(target_os = "android", target_os =
# "ios")))]`, so on a phone it compiles to an empty module and `init` does not
# exist. Depending on it unconditionally is what stops an Android build dead.
[target."cfg(not(any(target_os = \"android\", target_os = \"ios\")))".dependencies]
tauri-plugin-single-instance = "2"
# Same reasoning, different reason: neither plugin exists on a phone. The
# updater has nothing to update — a store or a sideloaded APK installs itself —
# and relaunching is not a thing an app does to itself there either.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[target."cfg(any(target_os = \"linux\", target_os = \"dragonfly\", target_os = \"freebsd\", target_os = \"netbsd\", target_os = \"openbsd\"))".dependencies]
webkit2gtk = "2.0"
gtk = "0.18"
glib = "0.18"

[target."cfg(target_os = \"windows\")".dependencies]
winapi = { version = "0.3", features = ["winuser"] }
# Printing to PDF goes through WebView2, the same webview Tauri already embeds
# on Windows. Both crates are MIT and were already in the tree via wry, so this
# only makes the dependency direct — nothing new ends up in the binary. Pinned
# to the versions wry resolves, so the COM interface types are the same ones.
webview2-com = "0.38"
windows = "0.61"

